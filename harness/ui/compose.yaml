name: jw-g5-ui
services:
  db:
    image: mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    env_file: ../../.runtime/ui/.env
    environment:
      MYSQL_DATABASE: g5_ui
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      retries: 40
    volumes: [ui-db:/var/lib/mysql]
  php:
    image: jwsoft/g5themes-ui-php:8.3
    build: ../runtime/g5themes-test/php
    depends_on:
      db: {condition: service_healthy}
    env_file: ../../.runtime/ui/.env
    volumes:
      - ../../.runtime/ui/site:/var/www/html
      - .:/harness:ro
  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on: [php]
    ports: ["127.0.0.1:18086:8080"]
    volumes:
      - ../../.runtime/ui/site:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  runner:
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    platform: linux/amd64
    profiles: [test]
    working_dir: /work
    environment:
      JW_UI_BASE_URL: http://web:8080
      CI: "true"
    volumes:
      - ../../:/work
      - ui-node-modules:/work/node_modules
    ipc: host
volumes:
  ui-db:
  ui-node-modules:
