map $http_host $external_port {
    default $server_port;
    ~:(?<requested_port>[0-9]+)$ $requested_port;
}
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php;
    charset utf-8;
    location / { try_files $uri $uri/ =404; }
    location ~* ^/data/.*\.(?:php|phtml|phar)$ { deny all; }
    location ~ /\. { deny all; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SERVER_PORT $external_port;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
    }
}
