<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>정상 디자인 감지 fixture</title>
    <style>
      :root {
        color: #172033;
        background: #ffffff;
        font-family: system-ui, sans-serif;
      }

      main {
        max-width: 70rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1.05;
      }

      h2 {
        font-size: 1.75rem;
        line-height: 1.2;
      }

      p {
        max-width: 42rem;
        line-height: 1.7;
      }

      a:focus-visible {
        outline: 3px solid #155eef;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>지역 의료진을 쉽게 확인하세요</h1>
      <p>진료과와 의료진 정보를 확인하고 병원에 직접 문의할 수 있습니다.</p>
      <a href="#doctors">의료진 보기</a>
      <section id="doctors" aria-labelledby="doctors-heading">
        <h2 id="doctors-heading">의료진</h2>
        <p>전문 분야와 진료 일정을 안내합니다.</p>
      </section>
    </main>
  </body>
</html>
