<svg xmlns="http://www.w3.org/2000/svg" class="decision-logic" viewBox="0 0 640 460" role="img" aria-label="두 관찰이 제품 선택 자료와 재료 안내에 연결되고, 두 자료가 발행 콘텐츠의 선행 조건이 됩니다. 알림은 운영 담당자와 발행 주기가 정해진 뒤 검토합니다."><style>.decision-logic text{font-family:Pretendard,Arial,sans-serif;fill:var(--color-base-content,#172533)}.decision-logic .muted{fill:var(--jw-color-muted,#4b5b67)}.decision-logic .ink{fill:var(--jw-link-ink,#006ca9)}.decision-logic .line{fill:none;stroke:var(--jw-link-ink,#006ca9);stroke-width:2}.decision-logic .rule{stroke:var(--color-base-content,#172533);stroke-opacity:.22;fill:none}.decision-logic .paper{fill:var(--color-base-100,#fff)}.decision-logic .soft{fill:var(--color-base-200,#edf0ef)}.decision-logic .node{fill:var(--color-base-100,#fff);stroke:var(--jw-link-ink,#006ca9);stroke-width:1.5}.decision-logic .gate{stroke-dasharray:5 4}.decision-logic .small{font-size:12px}.decision-logic .body{font-size:14px}.decision-logic .strong{font-size:16px;font-weight:750}.decision-logic .label{font-size:11px;font-weight:750;letter-spacing:.04em}</style><defs><marker id="logic-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--jw-link-ink,#006ca9)" stroke-width="1.7"/></marker></defs><rect x="0" y="0" width="282" height="63" class="soft"/><text x="14" y="21" class="label ink">E1 / 크기 판단</text><text x="14" y="44" class="small">사진만으로 실제 쓰임을 가늠하기 어려움</text><rect x="358" y="0" width="282" height="63" class="soft"/><text x="372" y="21" class="label ink">E2 / 재료 이해</text><text x="372" y="44" class="small">유약의 차이와 관리 방법이 궁금함</text><path d="M141 63V98" class="line"/><path d="M141 63V98" fill="none" stroke="transparent" marker-end="url(#logic-arrow)"/><path d="M499 63V98" class="line"/><path d="M499 63V98" fill="none" stroke="transparent" marker-end="url(#logic-arrow)"/><path d="M423 63V79H256V98" class="line"/><text x="285" y="89" class="small muted">재료 표기에도 연결</text><g data-decision-node="0"><rect x="0" y="103" width="282" height="176" class="node"/><text x="14" y="128" class="label ink">P1 / 먼저 반영</text><text x="14" y="153" class="strong">제품을 고르는 기준</text><g transform="translate(18 176)"><path d="M18 16h61v55q0 9-9 9H27q-9 0-9-9z" class="rule"/><path d="M79 27h8q19 0 19 16T87 59h-8" class="rule"/><path d="M18 3h61M18 0v6M79 0v6M4 16v64M1 16h6M1 80h6" class="line"/><text x="35" y="-4" class="small ink">Ø82</text><text x="12" y="94" class="small">H88mm · 280ml</text></g><text x="155" y="191" class="body">일상 머그</text><text x="155" y="216" class="small muted">커피와 따뜻한 차</text><text x="155" y="242" class="small">크기 · 용량 · 재료</text><text x="155" y="262" class="small muted">같은 위치에서 비교</text></g><g data-decision-node="1"><rect x="358" y="103" width="282" height="176" class="node"/><text x="372" y="128" class="label ink">P2 / 함께 반영</text><text x="372" y="153" class="strong">사용을 이어가는 안내</text><text x="372" y="184" class="small ink">세척</text><text x="421" y="184" class="body">부드러운 스펀지</text><path d="M372 197H626" class="rule"/><text x="372" y="218" class="small ink">온도</text><text x="421" y="218" class="body">급격한 변화 피하기</text><path d="M372 230H626" class="rule"/><text x="372" y="252" class="small ink">보관</text><text x="421" y="252" class="body">물기를 말린 뒤 보관</text></g><path d="M141 279V304H379M499 279V304H379" class="line"/><path d="M379 304V327" class="line"/><path d="M379 304V327" fill="none" stroke="transparent" marker-end="url(#logic-arrow)"/><text x="13" y="320" class="small ink">두 자료를 먼저 갖춘 뒤</text><rect x="0" y="332" width="405" height="82" class="soft"/><text x="14" y="355" class="label ink">발행할 콘텐츠</text><text x="14" y="380" class="strong">컬렉션 소개  +  사용·관리 안내</text><text x="14" y="402" class="small muted">첫 소식을 구성할 실제 자료가 먼저입니다.</text><path d="M405 373H457" class="line"/><path d="M436 361V385" class="line"/><text x="413" y="348" class="small">조건</text><g data-decision-node="2"><rect x="463" y="332" width="177" height="82" class="node gate"/><text x="477" y="355" class="label ink">보류 / 알림 기능</text><text x="477" y="381" class="body">담당 · 발행 주기 미정</text><text x="477" y="402" class="small muted">E3 운영 조건 확인 후</text></g><text x="0" y="447" class="small muted">실선: 자료의 선행 관계</text><text x="245" y="447" class="small muted">점선: 아직 충족하지 못한 조건</text></svg>