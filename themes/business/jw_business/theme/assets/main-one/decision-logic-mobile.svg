<svg xmlns="http://www.w3.org/2000/svg" class="decision-logic" viewBox="0 0 320 846" role="img" aria-label="두 관찰이 제품 선택 자료와 재료 안내에 연결되고, 두 자료가 발행 콘텐츠의 선행 조건이 됩니다. 알림은 운영 담당자와 발행 주기가 정해진 뒤 검토합니다."><style>.decision-logic text{font-family:Pretendard,Arial,sans-serif;fill:var(--color-base-content,#172533)}.decision-logic .muted{fill:var(--jw-color-muted,#4b5b67)}.decision-logic .ink{fill:var(--jw-link-ink,#006ca9)}.decision-logic .line{fill:none;stroke:var(--jw-link-ink,#006ca9);stroke-width:2}.decision-logic .rule{stroke:var(--color-base-content,#172533);stroke-opacity:.22;fill:none}.decision-logic .paper{fill:var(--color-base-100,#fff)}.decision-logic .soft{fill:var(--color-base-200,#edf0ef)}.decision-logic .node{fill:var(--color-base-100,#fff);stroke:var(--jw-link-ink,#006ca9);stroke-width:1.5}.decision-logic .gate{stroke-dasharray:5 4}.decision-logic .small{font-size:12px}.decision-logic .body{font-size:14px}.decision-logic .strong{font-size:16px;font-weight:750}.decision-logic .label{font-size:11px;font-weight:750;letter-spacing:.04em}</style><defs><marker id="logic-arrow-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--jw-link-ink,#006ca9)" stroke-width="1.7"/></marker></defs><rect x="0" y="0" width="320" height="63" class="soft"/><text x="14" y="22" class="label ink">E1 / 크기 판단</text><text x="14" y="46" class="body">사진만으로 쓰임을 가늠하기 어려움</text><path d="M38 63V100" class="line"/><path d="M38 63V100" fill="none" stroke="transparent" marker-end="url(#logic-arrow-mobile)"/><g data-decision-node="0"><rect x="0" y="106" width="320" height="188" class="node"/><text x="14" y="131" class="label ink">P1 / 먼저 반영</text><text x="14" y="157" class="strong">제품을 고르는 기준</text><g transform="translate(22 181)"><path d="M18 16h61v55q0 9-9 9H27q-9 0-9-9z" class="rule"/><path d="M79 27h8q19 0 19 16T87 59h-8" class="rule"/><path d="M18 3h61M18 0v6M79 0v6M4 16v64M1 16h6M1 80h6" class="line"/><text x="35" y="-4" class="small ink">Ø82</text><text x="12" y="94" class="small">H88mm · 280ml</text></g><text x="164" y="201" class="body">일상 머그</text><text x="164" y="229" class="small muted">커피와 따뜻한 차</text><text x="164" y="258" class="small">크기 · 용량 · 재료</text><text x="164" y="279" class="small muted">같은 위치에서 비교</text></g><rect x="0" y="325" width="320" height="63" class="soft"/><text x="14" y="347" class="label ink">E2 / 재료 이해</text><text x="14" y="371" class="body">유약의 차이와 관리 방법이 궁금함</text><path d="M296 325V83H274V100" class="line"/><text x="50" y="87" class="small ink">재료 표기는 P1에도 연결</text><path d="M38 388V417" class="line"/><path d="M38 388V417" fill="none" stroke="transparent" marker-end="url(#logic-arrow-mobile)"/><g data-decision-node="1"><rect x="0" y="422" width="320" height="161" class="node"/><text x="14" y="447" class="label ink">P2 / 함께 반영</text><text x="14" y="474" class="strong">사용을 이어가는 안내</text><text x="14" y="506" class="body">세척 · 부드러운 스펀지</text><text x="14" y="536" class="body">온도 · 급격한 변화 피하기</text><text x="14" y="566" class="body">보관 · 물기를 말린 뒤 보관</text></g><path d="M160 583V615" class="line"/><path d="M160 583V615" fill="none" stroke="transparent" marker-end="url(#logic-arrow-mobile)"/><rect x="0" y="620" width="320" height="83" class="soft"/><text x="14" y="643" class="label ink">P1 + P2 → 발행할 콘텐츠</text><text x="14" y="669" class="strong">컬렉션 소개 + 사용·관리 안내</text><text x="14" y="692" class="small muted">첫 소식을 구성할 실제 자료를 먼저 준비</text><path d="M160 703V731" class="line"/><path d="M151 721H169" class="line"/><g data-decision-node="2"><rect x="0" y="738" width="320" height="72" class="node gate"/><text x="14" y="761" class="label ink">보류 / 신제품 알림 기능</text><text x="14" y="787" class="body">E3 담당자 · 발행 주기 확정이 먼저</text></g><text x="0" y="836" class="small muted">실선: 선행 자료  /  점선: 미충족 조건</text></svg>