<svg xmlns="http://www.w3.org/2000/svg" class="priority-map" viewBox="0 0 360 540" role="img" aria-label="세로 기대 효과, 가로 실행 부담. 서비스 탐색은 세 고객 질문에 연결되어 기존 콘텐츠로 먼저 검증합니다. 문구 정리는 보조 작업이며 시스템 교체와 전체 재제작에는 운영과 범위 조사가 선행합니다."><style>.priority-map text{font-family:Pretendard,Arial,sans-serif;fill:var(--color-base-content,#172533)}.priority-map .muted{fill:var(--jw-color-muted,#4b5b67)}.priority-map .ink{fill:var(--jw-link-ink,#006ca9)}.priority-map .on{fill:var(--color-primary-content,#fff)}.priority-map .line{fill:none;stroke:var(--jw-link-ink,#006ca9);stroke-width:1.6}.priority-map .rule{stroke:var(--color-base-content,#172533);stroke-opacity:.25;fill:none}.priority-map .paper{fill:var(--color-base-100,#fff)}.priority-map .soft{fill:var(--color-base-200,#edf0ef)}.priority-map .chosen{fill:var(--color-base-100,#fff);stroke:var(--jw-link-ink,#006ca9);stroke-width:1.4}.priority-map .dot{fill:var(--color-primary,#006ca9)}.priority-map .scope{fill:none;stroke:var(--jw-color-muted,#4b5b67);stroke-dasharray:4 4}.priority-map .small{font-size:12px}.priority-map .body{font-size:14px}.priority-map .strong{font-size:16px;font-weight:750}.priority-map .label{font-size:11px;font-weight:700}</style><defs><marker id="priority-arrow-mobile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--jw-link-ink,#006ca9)" stroke-width="1.7"/></marker></defs><text x="0" y="16" class="body">기대 효과</text><text x="303" y="16" class="small">높음 ↑</text><rect x="0" y="36" width="360" height="462" class="paper"/><rect x="0" y="36" width="180" height="212" class="chosen priority-first"/><path d="M180 36V498M0 248H360" class="rule"/><circle cx="20" cy="71" r="14" class="dot"/><text x="12" y="75" class="label on">01</text><text x="42" y="76" class="body">서비스 탐색</text><text x="15" y="103" class="small ink">E1 + E2 + E3</text><rect x="17" y="120" width="148" height="84" class="soft"/><text x="27" y="142" class="small">방향 정하기</text><text x="27" y="159" class="small muted">관찰 → 판단</text><text x="27" y="182" class="small">경험 바꾸기</text><text x="27" y="199" class="small muted">화면 → 시안</text><text x="16" y="229" class="small ink">기존 콘텐츠로 검증</text><path d="M7 92V116H16" class="line"/><circle cx="200" cy="94" r="14" class="dot"/><text x="192" y="98" class="label on">02</text><text x="222" y="99" class="body">시스템 교체</text><rect x="197" y="127" width="58" height="29" class="soft"/><rect x="285" y="127" width="59" height="29" class="soft"/><text x="213" y="147" class="small">도구</text><text x="300" y="147" class="small">권한</text><path d="M257 141H279" class="line" marker-end="url(#priority-arrow-mobile)"/><rect x="285" y="185" width="59" height="29" class="soft"/><text x="300" y="205" class="small">교육</text><path d="M315 159V180" class="line" marker-end="url(#priority-arrow-mobile)"/><text x="197" y="229" class="small muted">운영 조사부터</text><circle cx="20" cy="293" r="14" class="dot"/><text x="12" y="297" class="label on">03</text><text x="42" y="298" class="body">안내 문구</text><text x="15" y="323" class="small ink">E1 + E3 / 빠른 정리</text><rect x="15" y="342" width="147" height="30" class="soft"/><text x="30" y="362" class="small muted">자세히 보기</text><path d="M28 358H126" class="rule"/><path d="M88 375V394" class="line" marker-end="url(#priority-arrow-mobile)"/><rect x="15" y="401" width="147" height="32" class="chosen"/><text x="29" y="422" class="small ink">내 상황과 비교</text><text x="15" y="457" class="small">구조 변화는 제한적</text><text x="15" y="479" class="small ink">01과 함께 정리</text><path d="M6 231V269" class="scope"/><circle cx="200" cy="316" r="14" class="dot"/><text x="192" y="320" class="label on">04</text><text x="222" y="321" class="body">전체 재제작</text><text x="194" y="348" class="small muted">전체 접점 변경</text><rect x="197" y="374" width="44" height="29" class="soft"/><rect x="250" y="374" width="44" height="29" class="soft"/><rect x="303" y="374" width="44" height="29" class="soft"/><text x="207" y="394" class="small">탐색</text><text x="260" y="394" class="small">사례</text><text x="313" y="394" class="small">문의</text><path d="M219 369V360H325V369M272 353V360" class="scope"/><text x="194" y="449" class="small">넓은 범위 확인</text><text x="194" y="479" class="small ink">추가 근거가 필요</text><text x="0" y="525" class="small">낮음</text><text x="216" y="525" class="body">실행 부담</text><text x="303" y="525" class="small">높음 →</text></svg>