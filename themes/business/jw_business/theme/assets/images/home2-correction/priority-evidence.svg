<svg xmlns="http://www.w3.org/2000/svg" class="priority-map" viewBox="0 0 680 495" role="img" aria-label="세로 기대 효과, 가로 실행 부담. 서비스 탐색은 세 고객 질문에 연결되어 기존 콘텐츠로 먼저 검증합니다. 문구 정리는 보조 작업이며 시스템 교체와 전체 재제작에는 운영과 범위 조사가 선행합니다."><style>.priority-map text{font-family:Pretendard,Arial,sans-serif;fill:var(--color-base-content,#172533)}.priority-map .muted{fill:var(--jw-color-muted,#4b5b67)}.priority-map .ink{fill:var(--jw-link-ink,#006ca9)}.priority-map .on{fill:var(--color-primary-content,#fff)}.priority-map .line{fill:none;stroke:var(--jw-link-ink,#006ca9);stroke-width:1.6}.priority-map .rule{stroke:var(--color-base-content,#172533);stroke-opacity:.25;fill:none}.priority-map .paper{fill:var(--color-base-100,#fff)}.priority-map .soft{fill:var(--color-base-200,#edf0ef)}.priority-map .chosen{fill:var(--color-base-100,#fff);stroke:var(--jw-link-ink,#006ca9);stroke-width:1.4}.priority-map .dot{fill:var(--color-primary,#006ca9)}.priority-map .scope{fill:none;stroke:var(--jw-color-muted,#4b5b67);stroke-dasharray:4 4}.priority-map .small{font-size:12px}.priority-map .body{font-size:14px}.priority-map .strong{font-size:16px;font-weight:750}.priority-map .label{font-size:11px;font-weight:700}</style><defs><marker id="priority-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--jw-link-ink,#006ca9)" stroke-width="1.7"/></marker></defs><text x="0" y="16" class="body">기대 효과</text><text x="621" y="16" class="small">높음 ↑</text><rect x="0" y="37" width="680" height="417" class="paper"/><rect x="0" y="37" width="340" height="205" class="chosen priority-first"/><path d="M340 37V454M0 242H680" class="rule"/><circle cx="36" cy="75" r="14" class="dot"/><text x="28" y="79" class="label on">01</text><text x="61" y="80" class="strong">서비스 탐색 개선</text><text x="18" y="107" class="small ink">E1 + E2 + E3 → 세 선택 질문을 함께</text><path d="M36 90V130H67" class="line"/><rect x="74" y="127" width="244" height="76" class="soft"/><text x="86" y="146" class="label ink">서비스 비교 지면</text><text x="86" y="169" class="small">방향 정하기</text><text x="197" y="169" class="small">관찰 → 판단</text><text x="86" y="192" class="small">경험 바꾸기</text><text x="197" y="192" class="small">화면 → 시안</text><text x="74" y="225" class="small">기존 콘텐츠 → 비교 시안으로 검증</text><circle cx="378" cy="94" r="14" class="dot"/><text x="370" y="98" class="label on">02</text><text x="403" y="99" class="strong">운영 시스템 교체</text><text x="362" y="126" class="small muted">운영 자료를 먼저 확인해야 함</text><rect x="367" y="150" width="73" height="36" class="soft"/><rect x="470" y="150" width="73" height="36" class="soft"/><rect x="573" y="150" width="85" height="36" class="soft"/><text x="387" y="173" class="body">도구</text><text x="490" y="173" class="body">권한</text><text x="597" y="173" class="body">교육</text><path d="M442 168H466" class="line" marker-end="url(#priority-arrow)"/><path d="M545 168H569" class="line" marker-end="url(#priority-arrow)"/><text x="366" y="222" class="small">도구 목록·권한 구조·교육 범위가 선행</text><circle cx="36" cy="291" r="14" class="dot"/><text x="28" y="295" class="label on">03</text><text x="61" y="296" class="strong">안내 문구 정리</text><text x="18" y="323" class="small ink">E1 + E3 / 설명을 빠르게 정리</text><rect x="19" y="346" width="117" height="34" class="soft"/><text x="33" y="368" class="small muted">자세히 보기</text><path d="M30 364H123" class="rule"/><path d="M142 363H169" class="line" marker-end="url(#priority-arrow)"/><rect x="177" y="346" width="144" height="34" class="chosen"/><text x="191" y="368" class="small ink">내 상황과 비교</text><text x="19" y="411" class="small">문장은 바뀌지만 선택 구조는 유지</text><text x="19" y="434" class="label ink">01과 함께 정리할 보조 작업</text><path d="M10 107V267" class="scope"/><circle cx="378" cy="316" r="14" class="dot"/><text x="370" y="320" class="label on">04</text><text x="403" y="321" class="strong">전체 화면 재제작</text><text x="361" y="347" class="small muted">전체 접점을 바꾸기 전 범위 확인</text><rect x="362" y="375" width="83" height="34" class="soft"/><rect x="467" y="375" width="83" height="34" class="soft"/><rect x="572" y="375" width="88" height="34" class="soft"/><text x="386" y="397" class="body">탐색</text><text x="491" y="397" class="body">사례</text><text x="597" y="397" class="body">문의</text><path d="M403 369V363H617V369M508 353V363" class="scope"/><text x="362" y="434" class="small">넓은 변경 범위 → 근거 보강 필요</text><text x="0" y="481" class="small">낮음</text><text x="465" y="481" class="body">실행 부담</text><text x="621" y="481" class="small">높음 →</text></svg>